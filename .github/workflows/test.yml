name: Test

on:
  push:
  pull_request:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Test (${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        homeassistant: [pinned, latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Create the matching Home Assistant environment
        run: python scripts/setup_test_environment.py --target "$HA_TARGET"
        env:
          HA_TARGET: ${{ matrix.homeassistant }}
      - run: .venv/bin/python -m pytest tests -q
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/mypy custom_components/dragino --strict --ignore-missing-imports

  ci:
    name: CI
    if: always()
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Require both environments to pass
        run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.pytest.result }}
